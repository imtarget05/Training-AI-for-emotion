# Config: E1 — Class-weighted loss (subset of v1)
# Hypothesis: class imbalance (16.5:1 train ratio) depresses Disgust recall.
# Class weights derived from train split inverse-frequency only.

# Inherits all v1 settings; overrides:
seed: 42
architecture: resnet50
pretrained: false
trainable_layers: head

train_split_dir: ~/.cache/kagglehub/datasets/msambare/fer2013/versions/1/train
validation_split: 0.2
stratified: true

image_size: 224
resize: 256
normalize_mean: [0.485, 0.456, 0.406]
normalize_std: [0.229, 0.224, 0.225]

optimizer: adam
learning_rate: 0.001
batch_size: 64
max_epochs: 50
weight_decay: 1e-5
scheduler:
  type: cosine
  T_max: 50
early_stopping_patience: 5

# CLASS-WEIGHTED LOSS (E1 change from v1)
loss:
  type: cross_entropy
  class_weights: train_inverse_frequency   # auto-computed from train split

# Subset for CPU feasibility
max_train_images_per_class: 800
max_val_images_per_class: 200

mlflow_experiment: emotion-resnet50
eval_dataset: ~/.cache/kagglehub/datasets/msambare/fer2013/versions/1/test
